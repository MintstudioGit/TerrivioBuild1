<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#09090b"/>

  <!-- Card -->
  <rect x="60" y="60" width="1080" height="510" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>

  <!-- Top-left accent gradient bar -->
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect x="60" y="60" width="1080" height="6" rx="3" fill="url(#g1)"/>

  <!-- Logo icon box -->
  <rect x="548" y="155" width="104" height="104" rx="20" fill="#7c3aed"/>
  <!-- Wand icon in icon box -->
  <path d="M572 200 L590 182" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <path d="M568 204 L572 200" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <path d="M590 182 L595 176 L600 182 L595 188Z" fill="white"/>
  <circle cx="567" cy="182" r="4" fill="#ddd6fe"/>
  <circle cx="606" cy="200" r="4" fill="#ddd6fe"/>
  <circle cx="610" cy="187" r="2.5" fill="#ddd6fe"/>

  <!-- Headline -->
  <text
    x="600" y="330"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="72"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    letter-spacing="-1"
  >Terrivio</text>

  <!-- Sub-headline -->
  <text
    x="600" y="392"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="26"
    fill="#a1a1aa"
    text-anchor="middle"
  >AI Prompt Engineering for Sales, Marketing &amp; Development</text>

  <!-- Domain pill -->
  <rect x="490" y="425" width="220" height="40" rx="20" fill="#7c3aed22" stroke="#7c3aed" stroke-width="1.5"/>
  <text
    x="600" y="450"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="16"
    fill="#a78bfa"
    text-anchor="middle"
    dominant-baseline="middle"
  >terrivio.com</text>
</svg>
